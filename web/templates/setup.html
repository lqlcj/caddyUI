{{define "title"}}初始化{{end}}

{{define "content"}}
<div class="auth-card">
  <h1 class="auth-title">欢迎使用 Relay</h1>
  <p class="auth-sub">这是第一次运行，先创建一个管理员账号。</p>

  {{with .Error}}<div class="flash flash-err">{{.}}</div>{{end}}

  <form method="post" action="/setup" class="form">
    <label class="field">
      <span class="label">用户名</span>
      <input type="text" name="username" value="{{.Username}}" required autofocus
             autocomplete="username" placeholder="admin">
      <span class="hint">3~32 位，字母数字和 _ - . </span>
    </label>

    <label class="field">
      <span class="label">密码</span>
      <input type="password" name="password" required autocomplete="new-password"
             minlength="8" placeholder="至少 8 位">
    </label>

    <label class="field">
      <span class="label">确认密码</span>
      <input type="password" name="confirm" required autocomplete="new-password"
             minlength="8" placeholder="再输一遍">
    </label>

    <button type="submit" class="btn btn-primary btn-block">创建并登录</button>
  </form>
</div>
{{end}}
