{{define "title"}}初始化{{end}}

{{define "content"}}
<div class="auth-card">
  <h1 class="auth-title"><span class="brand-mark" aria-hidden="true"></span>欢迎使用 CaddyUI</h1>
  <p class="auth-sub">这是第一次运行，用邮箱创建一个管理员账号。</p>

  {{with .Error}}<div class="flash flash-err">{{.}}</div>{{end}}

  <form method="post" action="/setup" class="form">
    <label class="field">
      <span class="label">邮箱</span>
      <input type="email" name="username" value="{{.Username}}" required autofocus
             autocomplete="username" spellcheck="false" placeholder="you@example.com">
      <span class="hint">
        这个邮箱同时是登录账号和 HTTPS 证书的联系邮箱 —— 证书续期出问题时
        Let's Encrypt 会往这里发提醒，不用再单独填一次。
      </span>
    </label>

    <label class="field">
      <span class="label">密码</span>
      <input type="password" name="password" required autocomplete="new-password"
             minlength="8" placeholder="至少 8 位">
    </label>

    <label class="field">
      <span class="label">确认密码</span>
      <input type="password" name="confirm" required autocomplete="new-password"
             minlength="8" placeholder="再输一遍">
    </label>

    <button type="submit" class="btn btn-primary btn-block">创建并登录</button>
  </form>
</div>
{{end}}
